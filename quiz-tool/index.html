  .restart-btn {

// ---- Build category list ----
const catCounts = {};
allQuestions.forEach(q => { catCounts[q.category] = (catCounts[q.category] || 0) + 1; });
const categories = Object.keys(catCounts).sort();

const catGrid = document.getElementById('catGrid');
let selectedCats = new Set();

// "All regions" button
function makeCatBtn(label, key, count) {
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.innerHTML = `${label}<span class="count">${count} question${count === 1 ? '' : 's'}</span>`;
  btn.dataset.key = key;
  btn.addEventListener('click', () => {
    if (key === '__ALL__') {
      selectedCats = new Set(categories);
    } else {
      if (selectedCats.has(key)) selectedCats.delete(key); else selectedCats.add(key);
      selectedCats.delete('__ALL__');
    }
    refreshCatButtons();
  });
  return btn;
}

catGrid.appendChild(makeCatBtn('All regions', '__ALL__', allQuestions.length));
categories.forEach(c => catGrid.appendChild(makeCatBtn(c, c, catCounts[c])));

function refreshCatButtons() {
  const allSelected = categories.every(c => selectedCats.has(c));
  document.querySelectorAll('.cat-btn').forEach(btn => {
    const key = btn.dataset.key;
    const isSel = key === '__ALL__' ? allSelected : selectedCats.has(key);
    btn.classList.toggle('selected', isSel);
  });
  document.getElementById('startBtn').disabled = selectedCats.size === 0;
}

// ---- Quiz state ----
let quizQuestions = [];
let current = 0;
let cluesRevealed = 1;
let results = []; // {correct}

const pickerScreen = document.getElementById('pickerScreen');
const quizScreen = document.getElementById('quizScreen');
const reviewScreen = document.getElementById('reviewScreen');
const cluesShown = document.getElementById('cluesShown');
const qnumEl = document.getElementById('qnum');
const catpillEl = document.getElementById('catpill');
const revealBlock = document.getElementById('revealBlock');
const answerLine = document.getElementById('answerLine');
const nextRow = document.getElementById('nextRow');
const answerBox = document.getElementById('answerBox');
const hintBtn = document.getElementById('hintBtn');
const revealBtn = document.getElementById('revealBtn');
const ridgeSvg = document.getElementById('ridgeSvg');

document.getElementById('startBtn').addEventListener('click', () => {
  quizQuestions = allQuestions.filter(q => selectedCats.has(q.category));
  // shuffle
  for (let i = quizQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizQuestions[i], quizQuestions[j]] = [quizQuestions[j], quizQuestions[i]];
  }
  current = 0;
  results = [];
  pickerScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  reviewScreen.classList.add('hidden');
  buildRidge();
  loadQuestion();
});

function buildRidge() {
  // simple ridge-line: a row of peaks, one per question, gold when passed
  ridgeSvg.innerHTML = '';
  const n = quizQuestions.length;
  const w = 600, h = 34;
  const step = w / n;
  let path = `M0,${h}`;
  for (let i = 0; i < n; i++) {
    const x1 = i * step + step * 0.5;
    path += ` L${x1},4 L${(i + 1) * step},${h}`;
  }
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  bg.setAttribute('d', path);
  bg.setAttribute('fill', '#e7e7e7');
  ridgeSvg.appendChild(bg);

  const fg = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  fg.setAttribute('id', 'ridgeFg');
  fg.setAttribute('fill', '#c9a227');
  ridgeSvg.appendChild(fg);
  updateRidge();
}

function updateRidge() {
  const n = quizQuestions.length;
  const w = 600, h = 34;
  const step = w / n;
  const passed = current;
  if (passed <= 0) {
    document.getElementById('ridgeFg').setAttribute('d', '');
    return;
  }
  let path = `M0,${h}`;
  for (let i = 0; i < passed; i++) {
    const x1 = i * step + step * 0.5;
    path += ` L${x1},4 L${(i + 1) * step},${h}`;
  }
  path += ` L${passed * step},${h} Z`;
  document.getElementById('ridgeFg').setAttribute('d', path);
}

function loadQuestion() {
  const q = quizQuestions[current];
  cluesRevealed = 1;
  qnumEl.textContent = `Question ${current + 1} of ${quizQuestions.length}`;
  catpillEl.textContent = q.category;
  answerBox.value = '';
  revealBlock.classList.remove('show');
  nextRow.style.display = 'none';
  hintBtn.disabled = q.clues.length <= 1;
  revealBtn.disabled = false;
  renderClues();
  updateRidge();
}

function renderClues() {
  const q = quizQuestions[current];
  cluesShown.innerHTML = '';
  for (let i = 0; i < cluesRevealed; i++) {
    const div = document.createElement('div');
    div.className = 'clue-line';
    div.textContent = q.clues[i];
    cluesShown.appendChild(div);
  }
  hintBtn.disabled = cluesRevealed >= q.clues.length;
}

hintBtn.addEventListener('click', () => {
  const q = quizQuestions[current];
  if (cluesRevealed < q.clues.length) {
    cluesRevealed++;
    renderClues();
  }
});

revealBtn.addEventListener('click', () => {
  const q = quizQuestions[current];
  cluesRevealed = q.clues.length;
  renderClues();
  answerLine.textContent = q.answer;
  revealBlock.classList.add('show');
  revealBtn.disabled = true;
  hintBtn.disabled = true;
});

document.getElementById('markCorrect').addEventListener('click', () => grade(true));
document.getElementById('markIncorrect').addEventListener('click', () => grade(false));

function grade(isCorrect) {
  results.push({ answer: quizQuestions[current].answer, correct: isCorrect });
  nextRow.style.display = 'flex';
}

document.getElementById('nextBtn').addEventListener('click', () => {
  current++;
  if (current >= quizQuestions.length) {
    finishQuiz();
  } else {
    loadQuestion();
  }
});

function finishQuiz() {
  updateRidge();
  quizScreen.classList.add('hidden');
  reviewScreen.classList.remove('hidden');
  const total = results.length;
  const numCorrect = results.filter(r => r.correct).length;
  document.getElementById('scoreLine').textContent = `${numCorrect} / ${total} correct`;
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  results.forEach(r => {
    const div = document.createElement('div');
    div.className = 'review-item ' + (r.correct ? 'right' : 'wrong');
    div.innerHTML = `<span>${r.correct ? '✔' : '✘'}</span><span class="ans">${r.answer}</span>`;
    list.appendChild(div);
  });
}

document.getElementById('restartBtn').addEventListener('click', () => {
  pickerScreen.classList.remove('hidden');
  quizScreen.classList.add('hidden');
  reviewScreen.classList.add('hidden');
});

refreshCatButtons();
</script>
