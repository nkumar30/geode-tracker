document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0 1px,transparent 1px);background-size:22px 22px;padding-bottom:60px\">\n  <div style=\"position:sticky;top:0;z-index:40;background:#16233d\">\n    <div style=\"max-width:900px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n      <div style=\"flex:1;min-width:150px\">\n        <h1 style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:21px;font-weight:800;letter-spacing:-.02em;color:#fdf8f0;line-height:1.05\">Geo Bee Home Base<\u002Fh1>\n        <div style=\"display:flex;align-items:center;gap:6px;font-size:11px;color:#8b9ab5;margin-top:3px\">\n          <span style=\"width:7px;height:7px;border-radius:50%;flex-shrink:0;background:{{ syncDot }}\"><\u002Fspan>\n          <span>{{ syncLabel }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#f5a524;color:#16233d;border-radius:12px;padding:7px 13px;text-align:center;transform:rotate(-2deg);box-shadow:0 2px 0 #c9821a\">\n        <div style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:19px;font-weight:800;line-height:1\">{{ countdownDays }}<\u002Fdiv>\n        <div style=\"font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase\">{{ countdownLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:900px;margin:0 auto;padding:0 12px 11px;display:flex;gap:6px;overflow-x:auto\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ t.click }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:900px;margin:0 auto;padding:18px\">\n\n    <sc-if value=\"{{ isToday }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"background:#fffdf8;border:2px solid #16233d;border-radius:20px;padding:20px 22px;margin-bottom:16px;box-shadow:5px 5px 0 #16233d;position:relative;overflow:hidden\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#a8362a\">{{ todayDateLine }}<\u002Fdiv>\n          <div style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:6px 0 4px;max-width:22ch\">{{ greeting }}<\u002Fdiv>\n          <div style=\"font-size:15px;color:#55617a;line-height:1.5;max-width:46ch\">{{ themeLine }}<\u002Fdiv>\n          <div style=\"display:flex;gap:9px;flex-wrap:wrap;margin-top:18px\">\n            <sc-for list=\"{{ statusBtns }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ s.click }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#636c80;margin-top:12px\">{{ statusNote }}<\u002Fdiv>\n          <sc-if value=\"{{ showStamp }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute;top:14px;right:-6px;border:3px solid #3e9c5f;color:#3e9c5f;border-radius:10px;padding:6px 12px;font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;animation:pop .35s ease-out both\">Stamped<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:10px;margin:0 2px 10px;flex-wrap:wrap\">\n          <h2 style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em\">Today's mission<\u002Fh2>\n          <span style=\"font-size:11.5px;font-weight:700;color:#8a5a06;background:#fdf0d8;border-radius:99px;padding:4px 10px\">{{ todayEffort }}<\u002Fspan>\n          <span style=\"flex:1\"><\u002Fspan>\n          <span style=\"font-size:12px;color:#636c80\">{{ streakLine }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;margin-bottom:26px\">\n          <sc-for list=\"{{ todayTasks }}\" as=\"k\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fffdf8;border:2px solid #16233d;border-radius:16px;padding:13px 15px;display:flex;gap:13px;align-items:center;flex-wrap:wrap;box-shadow:3px 3px 0 rgba(22,35,61,.12)\">\n              <span style=\"font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:5px 9px;border-radius:8px;flex-shrink:0;background:{{ k.chipBg }};color:{{ k.chipInk }}\">{{ k.kind }}<\u002Fspan>\n              <div style=\"flex:1;min-width:160px\">\n                <div style=\"font-size:15px;font-weight:600;line-height:1.35\">{{ k.title }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#636c80;margin-top:2px\">{{ k.detail }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ k.href }}\" hint-placeholder-val=\"{{ true }}\">\n                <a href=\"{{ k.href }}\" target=\"_blank\" rel=\"noopener\" style=\"flex-shrink:0;font-size:13px;font-weight:700;padding:8px 15px;border:2px solid #16233d;border-radius:10px;background:#f5a524;color:#16233d;text-decoration:none;box-shadow:2px 2px 0 #16233d\">{{ k.cta }}<\u002Fa>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h2 style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 2px 10px\">This week<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:9px\">\n          <sc-for list=\"{{ weekDays }}\" as=\"d\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ d.click }}\" style=\"{{ d.chip }}\">\n              <span style=\"font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.65\">{{ d.dow }}<\u002Fspan>\n              <span style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:18px;font-weight:800;line-height:1\">{{ d.num }}<\u002Fspan>\n              <span style=\"font-size:13px;line-height:1;min-height:13px\">{{ d.mark }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:#636c80;margin:0 2px 28px\">Tap any day to see it, move it, or leave a note.<\u002Fdiv>\n\n        <h2 style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 2px 12px\">Everything, one tap away<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <sc-for list=\"{{ hub }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:{{ g.tint }};margin:0 2px 8px\">{{ g.group }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <sc-for list=\"{{ g.items }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <a href=\"{{ r.href }}\" target=\"_blank\" rel=\"noopener\" style=\"background:#fffdf8;border:2px solid #e7dfd0;border-radius:14px;padding:12px 15px;display:flex;gap:12px;align-items:center;color:#16233d;text-decoration:none\">\n                    <span style=\"width:10px;height:26px;border-radius:99px;flex-shrink:0;background:{{ r.tint }}\"><\u002Fspan>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-size:14.5px;font-weight:600\">{{ r.name }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#636c80;margin-top:2px;line-height:1.45\">{{ r.note }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font-size:13px;font-weight:700;color:#0f5f60;flex-shrink:0\">Go →<\u002Fspan>\n                  <\u002Fa>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isWeek }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ prevWeek }}\" style=\"height:38px;width:38px;border:2px solid #16233d;background:#fffdf8;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0\">←<\u002Fbutton>\n          <div style=\"flex:1;min-width:150px\">\n            <div style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:21px;font-weight:800;letter-spacing:-.02em\">{{ weekRange }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#a8362a;font-weight:600\">{{ weekTheme }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ nextWeek }}\" style=\"height:38px;width:38px;border:2px solid #16233d;background:#fffdf8;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0\">→<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ weekRows }}\" as=\"d\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ d.click }}\" style=\"{{ d.row }}\">\n              <div style=\"width:46px;flex-shrink:0;text-align:left\">\n                <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;opacity:.6\">{{ d.dow }}<\u002Fdiv>\n                <div style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:20px;font-weight:800;line-height:1.05\">{{ d.num }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-width:0;text-align:left\">\n                <div style=\"font-size:14.5px;font-weight:600;line-height:1.35\">{{ d.headline }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;opacity:.65;margin-top:2px\">{{ d.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;padding:5px 10px;border-radius:8px;background:{{ d.pillBg }};color:{{ d.pillInk }}\">{{ d.pill }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isRes }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <sc-for list=\"{{ hub }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <div>\n            <div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:{{ g.tint }};margin:0 2px 9px\">{{ g.group }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ g.items }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <a href=\"{{ r.href }}\" target=\"_blank\" rel=\"noopener\" style=\"background:#fffdf8;border:2px solid #16233d;border-radius:15px;padding:14px 16px;display:flex;gap:13px;align-items:center;color:#16233d;text-decoration:none;box-shadow:3px 3px 0 rgba(22,35,61,.1)\">\n                  <span style=\"width:11px;height:30px;border-radius:99px;flex-shrink:0;background:{{ r.tint }}\"><\u002Fspan>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font-size:15px;font-weight:600\">{{ r.name }}<\u002Fdiv>\n                    <div style=\"font-size:12.5px;color:#636c80;margin-top:3px;line-height:1.45\">{{ r.note }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-size:13px;font-weight:700;color:#0f5f60;flex-shrink:0\">Go →<\u002Fspan>\n                <\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"background:#fdf0d8;border:2px dashed #f0c46a;border-radius:15px;padding:14px 16px;font-size:12.5px;color:#7a4f06;line-height:1.55\">The buzzer and quiz tools are already linked at their planned homes. Those two cards light up the moment you push the files to <strong>nkumar30.github.io/buzzer-practice/<\u002Fstrong> and <strong>/geo-quiz/<\u002Fstrong>.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isLog }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"background:#fffdf8;border:2px solid #16233d;border-radius:18px;padding:17px 19px;margin-bottom:22px;box-shadow:4px 4px 0 rgba(22,35,61,.12)\">\n          <div style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:3px\">Log a score<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#636c80;margin-bottom:14px;line-height:1.5\">For rounds run outside the tools — verbal buzzer drills, mock competitions. Tool sessions land here on their own once Firebase is connected.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px\">\n            <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#636c80\">Topic\n              <sc-raw-select value=\"{{ fTopic }}\" sc-camel-on-change=\"{{ setFTopic }}\" style=\"height:38px;border:2px solid #e7dfd0;border-radius:10px;padding:0 8px;font-size:13.5px;font-weight:400;letter-spacing:0;text-transform:none;color:#16233d;background:#fff\">\n                <sc-for list=\"{{ topicOpts }}\" as=\"o\" hint-placeholder-count=\"6\">\n                  <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#636c80\">Source\n              <sc-raw-select value=\"{{ fSource }}\" sc-camel-on-change=\"{{ setFSource }}\" style=\"height:38px;border:2px solid #e7dfd0;border-radius:10px;padding:0 8px;font-size:13.5px;font-weight:400;letter-spacing:0;text-transform:none;color:#16233d;background:#fff\">\n                <sc-for list=\"{{ sourceOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                  <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#636c80\">Date\n              <input type=\"date\" value=\"{{ fDate }}\" sc-camel-on-change=\"{{ setFDate }}\" style=\"height:38px;border:2px solid #e7dfd0;border-radius:10px;padding:0 8px;font-size:13.5px;font-weight:400;letter-spacing:0;text-transform:none;color:#16233d;background:#fff\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#636c80\">Correct\n              <input type=\"number\" min=\"0\" value=\"{{ fRaw }}\" sc-camel-on-change=\"{{ setFRaw }}\" placeholder=\"14\" style=\"height:38px;border:2px solid #e7dfd0;border-radius:10px;padding:0 10px;font-size:13.5px;font-weight:400;letter-spacing:0;text-transform:none;color:#16233d;background:#fff\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#636c80\">Out of\n              <input type=\"number\" min=\"1\" value=\"{{ fTotal }}\" sc-camel-on-change=\"{{ setFTotal }}\" placeholder=\"20\" style=\"height:38px;border:2px solid #e7dfd0;border-radius:10px;padding:0 10px;font-size:13.5px;font-weight:400;letter-spacing:0;text-transform:none;color:#16233d;background:#fff\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <input value=\"{{ fMissed }}\" sc-camel-on-change=\"{{ setFMissed }}\" placeholder=\"Missed questions or weak spots, comma separated (optional)\" style=\"width:100%;height:38px;border:2px solid #e7dfd0;border-radius:10px;padding:0 11px;font-size:13.5px;background:#fff;margin-bottom:11px\">\n          <button sc-camel-on-click=\"{{ addScore }}\" style=\"height:40px;padding:0 20px;border:2px solid #16233d;border-radius:11px;background:#3e9c5f;color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 #16233d\">Save score<\u002Fbutton>\n        <\u002Fdiv>\n\n        <h2 style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 2px 11px\">The log<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <sc-for list=\"{{ history }}\" as=\"h\" hint-placeholder-count=\"5\">\n            <div style=\"background:#fffdf8;border:2px solid #e7dfd0;border-radius:15px;padding:14px 16px\">\n              <div style=\"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap\">\n                <span style=\"font-size:14px;font-weight:700\">{{ h.date }}<\u002Fspan>\n                <span style=\"font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:8px;background:{{ h.pillBg }};color:{{ h.pillInk }}\">{{ h.pill }}<\u002Fspan>\n                <span style=\"font-size:12.5px;color:#636c80;flex:1;min-width:120px\">{{ h.theme }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:13px;color:#55617a;margin-top:7px;line-height:1.5\">{{ h.assigned }}<\u002Fdiv>\n              <sc-if value=\"{{ h.hasScores }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;flex-direction:column;gap:5px;margin-top:10px\">\n                  <sc-for list=\"{{ h.scores }}\" as=\"s\" hint-placeholder-count=\"1\">\n                    <div style=\"display:flex;gap:10px;align-items:center;font-size:12.5px;background:#fdf8f0;border:2px solid #e7dfd0;border-radius:10px;padding:8px 11px;flex-wrap:wrap\">\n                      <span style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:15px;font-weight:800;color:{{ s.ink }}\">{{ s.pct }}<\u002Fspan>\n                      <span style=\"font-weight:600\">{{ s.topic }}<\u002Fspan>\n                      <span style=\"color:#636c80;flex:1;min-width:80px\">{{ s.meta }}<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ s.del }}\" style=\"border:none;background:transparent;color:#636c80;font-size:12px;cursor:pointer\">Remove<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ h.note }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-size:12.5px;color:#7a4f06;background:#fdf0d8;border-radius:10px;padding:8px 11px;margin-top:9px;line-height:1.5\">{{ h.note }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ historyEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fffdf8;border:2px dashed #e7dfd0;border-radius:16px;padding:28px;text-align:center;font-size:13.5px;color:#636c80\">Nothing here yet. Stamp a day on the Today screen and it shows up.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCoachLocked }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fffdf8;border:2px solid #16233d;border-radius:20px;padding:28px 24px;max-width:360px;margin:32px auto;text-align:center;box-shadow:5px 5px 0 #16233d\">\n        <div style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px\">Coach's corner<\u002Fdiv>\n        <div style=\"font-size:13px;color:#636c80;line-height:1.5;margin-bottom:17px\">Plan editing and the full picture. Same link, PIN-gated.<\u002Fdiv>\n        <input type=\"password\" value=\"{{ pinInput }}\" sc-camel-on-change=\"{{ setPin }}\" placeholder=\"PIN\" style=\"width:100%;height:44px;border:2px solid #e7dfd0;border-radius:12px;padding:0 12px;font-size:18px;text-align:center;letter-spacing:.35em;margin-bottom:10px;background:#fff\">\n        <button sc-camel-on-click=\"{{ unlock }}\" style=\"width:100%;height:44px;border:2px solid #16233d;border-radius:12px;background:#f5a524;color:#16233d;font-size:15px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 #16233d\">Unlock<\u002Fbutton>\n        <div style=\"font-size:12px;color:#e35a4a;font-weight:600;margin-top:10px;min-height:16px\">{{ pinError }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCoach }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:24px\">\n          <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fffdf8;border:2px solid #16233d;border-radius:16px;padding:15px 16px;box-shadow:3px 3px 0 rgba(22,35,61,.12)\">\n              <div style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;color:{{ s.tint }}\">{{ s.value }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#636c80;margin-top:5px;line-height:1.35\">{{ s.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h2 style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 2px 11px\">Scores by region<\u002Fh2>\n        <div style=\"background:#fffdf8;border:2px solid #e7dfd0;border-radius:16px;padding:17px 19px;margin-bottom:24px;display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ regionStats }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px\">\n                <span style=\"font-weight:600\">{{ r.name }}<\u002Fspan>\n                <span style=\"color:#636c80\">{{ r.meta }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:12px;background:#f1ece1;border-radius:99px;overflow:hidden\">\n                <div style=\"height:100%;border-radius:99px;width:{{ r.width }};background:{{ r.color }}\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noScores }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13px;color:#636c80;text-align:center;padding:10px 0\">No scores yet — log one on the Log tab, or connect Firebase so tool sessions flow in by themselves.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasWeak }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fdeae7;border:2px solid #e35a4a;border-radius:16px;padding:16px 18px;margin-bottom:24px\">\n            <div style=\"font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a8362a;margin-bottom:7px\">Worth another pass<\u002Fdiv>\n            <div style=\"font-size:14px;color:#7d2a20;line-height:1.55\">{{ weakText }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <h2 style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 2px 11px\">Edit the plan<\u002Fh2>\n        <div style=\"background:#fffdf8;border:2px solid #e7dfd0;border-radius:16px;padding:17px 19px;margin-bottom:24px\">\n          <div style=\"font-size:12.5px;color:#636c80;line-height:1.5;margin-bottom:12px\">Tap a day on the Week tab to rewrite its tasks. Or set this week's focus line here.<\u002Fdiv>\n          <input value=\"{{ themeDraft }}\" sc-camel-on-change=\"{{ setThemeDraft }}\" placeholder=\"This week's focus\" style=\"width:100%;height:40px;border:2px solid #e7dfd0;border-radius:10px;padding:0 11px;font-size:13.5px;margin-bottom:10px;background:#fff\">\n          <button sc-camel-on-click=\"{{ saveTheme }}\" style=\"height:38px;padding:0 17px;border:2px solid #16233d;border-radius:11px;background:#fffdf8;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 #16233d\">Save focus<\u002Fbutton>\n        <\u002Fdiv>\n\n        <h2 style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 2px 11px\">Sync &amp; data<\u002Fh2>\n        <div style=\"background:#fffdf8;border:2px solid #e7dfd0;border-radius:16px;padding:17px 19px\">\n          <div style=\"font-size:13px;color:#55617a;line-height:1.6;margin-bottom:12px\">Paste GeoChallenge's Firebase config below (Hub Settings → copy the whole <strong>firebaseConfig<\u002Fstrong> object). Both tools then share one store, so GeoChallenge sessions show up in the log above.<\u002Fdiv>\n          <textarea value=\"{{ cfgDraft }}\" sc-camel-on-change=\"{{ setCfgDraft }}\" placeholder=\"{ apiKey: &quot;...&quot;, projectId: &quot;...&quot;, appId: &quot;...&quot;, databaseURL: &quot;...&quot; }\" style=\"width:100%;min-height:104px;border:2px solid #e7dfd0;border-radius:11px;padding:10px 12px;font-size:12.5px;font-family:ui-monospace,monospace;line-height:1.5;resize:vertical;margin-bottom:11px;background:#fff\"><\u002Ftextarea>\n          <div style=\"display:flex;gap:9px;flex-wrap:wrap;align-items:center\">\n            <button sc-camel-on-click=\"{{ saveCfg }}\" style=\"height:38px;padding:0 17px;border:2px solid #16233d;border-radius:11px;background:#17888a;color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 #16233d\">Connect<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ exportData }}\" style=\"height:38px;padding:0 15px;border:2px solid #e7dfd0;border-radius:11px;background:#fff;font-size:13.5px;font-weight:600;cursor:pointer\">Export backup<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ lock }}\" style=\"height:38px;padding:0 15px;border:2px solid #e7dfd0;border-radius:11px;background:#fff;font-size:13.5px;cursor:pointer;color:#636c80\">Lock<\u002Fbutton>\n            <span style=\"font-size:12.5px;color:#636c80\">{{ cfgStatus }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ sheetOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeSheet }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(22,35,61,.45);display:flex;align-items:flex-end;justify-content:center\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"background:#fffdf8;border-top:3px solid #16233d;border-radius:22px 22px 0 0;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;padding:20px 22px 34px\">\n        <div style=\"width:40px;height:5px;background:#e7dfd0;border-radius:99px;margin:0 auto 16px\"><\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.15\">{{ sheetTitle }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#a8362a;font-weight:600;margin:3px 0 16px\">{{ sheetSub }}<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px\">\n          <sc-for list=\"{{ sheetStatusBtns }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ s.click }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#636c80;margin-bottom:8px\">Assigned<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;margin-bottom:15px\">\n          <sc-for list=\"{{ sheetTasks }}\" as=\"k\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fdf8f0;border:2px solid #e7dfd0;border-radius:12px;padding:11px 13px;display:flex;gap:11px;align-items:center;flex-wrap:wrap\">\n              <span style=\"font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:7px;background:{{ k.chipBg }};color:{{ k.chipInk }}\">{{ k.kind }}<\u002Fspan>\n              <span style=\"flex:1;min-width:140px;font-size:13.5px;font-weight:500\">{{ k.title }}<\u002Fspan>\n              <sc-if value=\"{{ k.href }}\" hint-placeholder-val=\"{{ true }}\">\n                <a href=\"{{ k.href }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12.5px;font-weight:700\">Go →<\u002Fa>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <textarea value=\"{{ noteDraft }}\" sc-camel-on-change=\"{{ setNoteDraft }}\" placeholder=\"Note for this day (optional)\" style=\"width:100%;min-height:62px;border:2px solid #e7dfd0;border-radius:11px;padding:9px 11px;font-size:13.5px;line-height:1.5;resize:vertical;margin-bottom:11px;background:#fff\"><\u002Ftextarea>\n        <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ pushToTomorrow }}\" style=\"height:38px;padding:0 15px;border:2px solid #e35a4a;border-radius:11px;background:#fdeae7;color:#a8362a;font-size:13.5px;font-weight:700;cursor:pointer\">Move to tomorrow<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ saveNote }}\" style=\"height:38px;padding:0 15px;border:2px solid #e7dfd0;border-radius:11px;background:#fff;font-size:13.5px;font-weight:600;cursor:pointer\">Save note<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ coachUnlocked }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-top:2px solid #e7dfd0;margin-top:18px;padding-top:15px\">\n            <div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#17888a;margin-bottom:8px\">Coach — rewrite this day<\u002Fdiv>\n            <textarea value=\"{{ tasksDraft }}\" sc-camel-on-change=\"{{ setTasksDraft }}\" placeholder=\"One task per line. Start a line with read:, quiz:, buzzer:, audio: or map: to set its tag.\" style=\"width:100%;min-height:100px;border:2px solid #e7dfd0;border-radius:11px;padding:10px 12px;font-size:13px;line-height:1.6;resize:vertical;margin-bottom:10px;background:#fff\"><\u002Ftextarea>\n            <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ saveTasks }}\" style=\"height:38px;padding:0 17px;border:2px solid #16233d;border-radius:11px;background:#17888a;color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 #16233d\">Save day<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ resetTasks }}\" style=\"height:38px;padding:0 15px;border:2px solid #e7dfd0;border-radius:11px;background:#fff;font-size:13.5px;cursor:pointer;color:#636c80\">Reset to plan<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  \n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;studentName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Keshav&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;coachPin&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1234&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nconst REGIONS = [\n  { name: 'Southeast Asia', c: ['Brunei', 'Cambodia'] },\n  { name: 'Middle East', c: ['Jordan', 'Israel', 'Iraq'] },\n  { name: 'South Asia', c: ['Afghanistan', 'India'] },\n  { name: 'East Asia', c: ['Japan', 'China'] },\n  { name: 'Caucasus & Eastern Europe', c: ['Armenia', 'Russia'] },\n  { name: 'Western Europe', c: ['Italy', 'Spain', 'France'] },\n  { name: 'East Africa', c: ['Ethiopia', 'Kenya', 'Tanzania'] },\n  { name: 'Southern Africa', c: ['Madagascar', 'Mozambique'] },\n  { name: 'North Africa', c: ['Egypt', 'Libya', 'Morocco'] },\n  { name: 'North America', c: ['United States', 'Canada', 'Mexico'] },\n  { name: 'South America', c: ['Argentina', 'Brazil'] },\n  { name: 'Oceania', c: ['Australia', 'New Zealand'] }\n];\nconst KINDS = {\n  read: { bg: '#efe9fb', ink: '#4a327d' },\n  quiz: { bg: '#e4f4e9', ink: '#256b40' },\n  buzzer: { bg: '#fdeae7', ink: '#a8362a' },\n  audio: { bg: '#e2f1f1', ink: '#0f5f60' },\n  map: { bg: '#fdf0d8', ink: '#8a5a06' },\n  review: { bg: '#eeeade', ink: '#55617a' }\n};\nconst L = {\n  geochallenge: 'https://nkumar30.github.io/geochallenge',\n  buzzer: 'https://nkumar30.github.io/buzzer-practice/',\n  quiz: 'https://nkumar30.github.io/geo-quiz/',\n  sheet: 'https://docs.google.com/spreadsheets/d/1NFRoV154rYWojfRyCyyK8r-Fw6_OxF5UZJJAPLBVNRA',\n  jetpunk: 'https://www.jetpunk.com/tags/geography',\n  quizvidya: 'https://www.google.com/search?q=quizvidya+geography',\n  notebook: 'https://notebooklm.google.com'\n};\nconst dossier = (c) => 'https://geobee4u.blogspot.com/search?q=' + encodeURIComponent(c);\nconst SOURCES = ['Verbal drill with coach', 'Quiz tool', 'Buzzer practice', 'GeoChallenge', 'Mock round', 'Other'];\nconst REGIONALS = new Date(2026, 10, 14);\nconst NATIONALS = new Date(2027, 4, 18);\nconst DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];\nconst MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\nconst KEY = 'geohub.v1';\n\nconst dk = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');\nconst parseKey = (k) => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };\nconst addDays = (d, n) => { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; };\nconst startOfWeek = (d) => addDays(d, -d.getDay());\nconst dayDiff = (a, b) => Math.round((startOfWeek(a) - startOfWeek(b)) / 86400000);\nconst pretty = (d) => DOW[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate();\nconst regionAt = (i) => { const n = REGIONS.length; return REGIONS[((i % n) + n) % n]; };\n\nclass Component extends DCLogic {\n  state = {\n    tab: 'today', days: {}, scores: [], cfg: '', unlocked: false,\n    pinInput: '', pinError: '', weekOffset: 0, sheetKey: null,\n    noteDraft: '', tasksDraft: '', themeDraft: '', cfgDraft: '',\n    f: { topic: 'Southeast Asia', source: SOURCES[0], date: dk(new Date()), raw: '', total: '', missed: '' },\n    sync: 'off'\n  };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(KEY);\n      if (raw) {\n        const s = JSON.parse(raw);\n        this.setState({ days: s.days || {}, scores: s.scores || [], cfg: s.cfg || '', cfgDraft: s.cfg || '' });\n        if (s.cfg) setTimeout(() => this.connect(s.cfg), 60);\n      }\n    } catch (e) { /* first run */ }\n  }\n\n  persist(next) {\n    const s = Object.assign({}, this.state, next);\n    try { localStorage.setItem(KEY, JSON.stringify({ days: s.days, scores: s.scores, cfg: s.cfg, updatedAt: Date.now() })); } catch (e) {}\n    if (this.ref) { try { this.ref.set({ days: s.days, scores: s.scores, updatedAt: Date.now() }); } catch (e) {} }\n    this.setState(next);\n  }\n\n  connect(cfgText) {\n    let cfg;\n    try {\n      cfg = JSON.parse(cfgText);\n    } catch (e) {\n      try { cfg = (new Function('return (' + cfgText + ')'))(); } catch (e2) { this.setState({ sync: 'error' }); return; }\n    }\n    if (!cfg || !cfg.projectId) { this.setState({ sync: 'error' }); return; }\n    if (!cfg.databaseURL) cfg.databaseURL = 'https://' + cfg.projectId + '-default-rtdb.firebaseio.com';\n    this.setState({ sync: 'connecting' });\n    const load = (src) => new Promise((res, rej) => {\n      if (document.querySelector('script[data-fb=\"' + src + '\"]')) return res();\n      const s = document.createElement('script');\n      s.src = src; s.dataset.fb = src; s.onload = res; s.onerror = rej;\n      document.head.appendChild(s);\n    });\n    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';\n    load(base + 'firebase-app-compat.js')\n      .then(() => load(base + 'firebase-database-compat.js'))\n      .then(() => {\n        const fb = window.firebase;\n        const app = fb.apps && fb.apps.length ? fb.apps[0] : fb.initializeApp(cfg);\n        this.ref = fb.database(app).ref('geoHub/state');\n        this.ref.on('value', (snap) => {\n          const v = snap.val();\n          this.setState({ sync: 'live' });\n          if (v && v.days) this.setState({ days: v.days, scores: v.scores || [] });\n        }, () => this.setState({ sync: 'error' }));\n      })\n      .catch(() => this.setState({ sync: 'error' }));\n  }\n\n  plan(key) {\n    const d = parseKey(key);\n    const region = regionAt(Math.floor(dayDiff(d, new Date(2026, 8, 13)) / 7));\n    const a = region.c[0], b = region.c[1 % region.c.length];\n    const T = {\n      0: [['review', 'Weekly recap — ' + region.name, 'Skim both dossiers, flag anything shaky', null],\n          ['quiz', 'Mixed quiz, 15 questions', 'Anything from this week', L.quiz]],\n      1: [['read', a + ' dossier', 'Capital, borders, rivers, one-line history', dossier(a)],\n          ['quiz', a + ' quiz', 'Right after reading, while it is fresh', L.quiz]],\n      2: [['buzzer', 'Buzzer drill — ' + region.name, '10 minutes, speed over polish', L.buzzer],\n          ['map', 'Map sprint', 'Place every country in ' + region.name, L.jetpunk]],\n      3: [['read', b + ' dossier', 'Same routine as Monday', dossier(b)],\n          ['quiz', b + ' quiz', 'Log the misses', L.quiz]],\n      4: [['audio', 'NotebookLM audio — ' + region.name, 'Listen on the way home', L.notebook],\n          ['quiz', 'Quizvidya set', 'Short one, 10 minutes', L.quizvidya]],\n      5: [['buzzer', 'Live round with Amma', 'GeoChallenge, host mode', L.geochallenge]],\n      6: [['review', 'Missed-question review', 'Only the ones you got wrong this week', null],\n          ['buzzer', 'Buzzer sprint', 'Red Set 2026 bank', L.buzzer]]\n    }[d.getDay()];\n    const ov = this.state.days[key];\n    if (ov && ov.tasks) {\n      return {\n        region: region.name,\n        theme: ov.theme || region.name + ' deep dive',\n        tasks: ov.tasks.map((t, i) => ({ id: key + '-c' + i, kind: t.kind, title: t.title, detail: t.detail || '', href: t.href || null }))\n      };\n    }\n    return {\n      region: region.name,\n      theme: (ov && ov.theme) || region.name + ' deep dive',\n      tasks: T.map((t, i) => ({ id: key + '-' + i, kind: t[0], title: t[1], detail: t[2], href: t[3] }))\n    };\n  }\n\n  setDay(key, patch) {\n    const days = Object.assign({}, this.state.days);\n    days[key] = Object.assign({}, days[key], patch);\n    this.persist({ days });\n  }\n\n  statusSet(key, s) {\n    const cur = this.state.days[key] && this.state.days[key].status;\n    this.setDay(key, { status: cur === s ? null : s });\n  }\n\n  mkStatusBtns(key, big) {\n    const cur = (this.state.days[key] || {}).status;\n    const defs = [['done', 'Nailed it', '#3e9c5f'], ['partial', 'Halfway', '#f5a524'], ['skipped', 'Not today', '#636c80']];\n    return defs.map((d) => {\n      const on = cur === d[0];\n      const pad = big ? '10px 17px' : '8px 14px';\n      return {\n        label: d[1],\n        click: () => this.statusSet(key, d[0]),\n        style: 'padding:' + pad + ';border-radius:12px;font-size:' + (big ? '14.5px' : '13px') + ';font-weight:700;cursor:pointer;border:2px solid #16233d;transition:transform .12s;' +\n          (on\n            ? 'background:' + d[2] + ';color:' + (d[0] === 'partial' ? '#16233d' : '#fff') + ';box-shadow:3px 3px 0 #16233d'\n            : 'background:#fffdf8;color:#55617a;box-shadow:none')\n      };\n    });\n  }\n\n  dayVisual(key) {\n    const st = (this.state.days[key] || {}).status;\n    if (st === 'done') return { bg: '#e4f4e9', bdr: '#8fce9f', ink: '#1f5c38', mark: '✓', pill: 'Done', pillBg: '#e4f4e9', pillInk: '#1f5c38' };\n    if (st === 'partial') return { bg: '#fdf0d8', bdr: '#f0c46a', ink: '#7a4f06', mark: '◑', pill: 'Halfway', pillBg: '#fdf0d8', pillInk: '#7a4f06' };\n    if (st === 'skipped') return { bg: '#f1ece1', bdr: '#e0d8c8', ink: '#8b8578', mark: '·', pill: 'Skipped', pillBg: '#f1ece1', pillInk: '#6f6a5e' };\n    if (st === 'carried') return { bg: '#fdeae7', bdr: '#f0a99e', ink: '#a8362a', mark: '→', pill: 'Moved', pillBg: '#fdeae7', pillInk: '#a8362a' };\n    return { bg: '#fffdf8', bdr: '#e7dfd0', ink: '#16233d', mark: '', pill: 'Open', pillBg: '#f1ece1', pillInk: '#6f6a5e' };\n  }\n\n  setF(k, v) { this.setState({ f: Object.assign({}, this.state.f, { [k]: v }) }); }\n\n  openSheet(k) {\n    const d = this.state.days[k] || {};\n    const p = this.plan(k);\n    this.setState({ sheetKey: k, noteDraft: d.note || '', tasksDraft: p.tasks.map((t) => t.kind + ': ' + t.title).join('\\n') });\n  }\n\n  renderVals() {\n    const today = new Date();\n    const tKey = dk(today);\n    const name = this.props.studentName || 'Keshav';\n    const pin = String(this.props.coachPin || '1234');\n    const tab = this.state.tab;\n    const tp = this.plan(tKey);\n    const tStatus = (this.state.days[tKey] || {}).status;\n\n    const dRegionals = Math.ceil((REGIONALS - today) / 86400000);\n    const dNationals = Math.ceil((NATIONALS - today) / 86400000);\n    const beforeRegionals = dRegionals > 0;\n\n    const tabDefs = [['today', 'Today'], ['week', 'Week'], ['res', 'Resources'], ['log', 'Log'], ['coach', 'Coach']];\n    const tabs = tabDefs.map((t) => ({\n      label: t[1], click: () => this.setState({ tab: t[0] }),\n      style: 'flex:1;min-width:76px;padding:9px 10px;border-radius:11px;border:2px solid ' +\n        (tab === t[0] ? '#f5a524;background:#f5a524;color:#16233d;font-weight:700' : 'rgba(253,248,240,.22);background:transparent;color:#c3ccdc;font-weight:600') +\n        ';font-size:13px;cursor:pointer;white-space:nowrap'\n    }));\n\n    const wkStart = addDays(startOfWeek(today), this.state.weekOffset * 7);\n    const week = [];\n    for (let i = 0; i < 7; i++) week.push(addDays(wkStart, i));\n\n    const weekDays = week.map((d) => {\n      const k = dk(d), v = this.dayVisual(k), isT = k === tKey;\n      return {\n        dow: DOW[d.getDay()][0], num: d.getDate(), mark: v.mark,\n        click: () => this.openSheet(k),\n        chip: 'display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;border-radius:14px;cursor:pointer;min-height:70px;justify-content:center;' +\n          (isT ? 'background:#16233d;color:#fdf8f0;border:2px solid #f5a524;box-shadow:0 0 0 3px rgba(245,165,36,.25)' : 'background:' + v.bg + ';color:' + v.ink + ';border:2px solid ' + v.bdr)\n      };\n    });\n\n    const weekRows = week.map((d) => {\n      const k = dk(d), v = this.dayVisual(k), p = this.plan(k), isT = k === tKey;\n      return {\n        dow: DOW[d.getDay()], num: d.getDate(), pill: isT ? 'Today' : v.pill,\n        pillBg: isT ? '#f5a524' : v.pillBg, pillInk: isT ? '#16233d' : v.pillInk,\n        headline: p.tasks[0] ? p.tasks[0].title : 'Open day',\n        sub: p.tasks.length > 1 ? '+ ' + (p.tasks.length - 1) + ' more · ' + p.region : p.region,\n        click: () => this.openSheet(k),\n        row: 'display:flex;gap:13px;align-items:center;width:100%;padding:14px 16px;border-radius:15px;cursor:pointer;text-align:left;background:' + v.bg + ';border:2px solid ' + (isT ? '#16233d' : v.bdr) + ';color:' + v.ink + (isT ? ';box-shadow:3px 3px 0 #16233d' : '')\n      };\n    });\n\n    const mkTask = (t) => ({\n      kind: t.kind, title: t.title, detail: t.detail, href: t.href,\n      cta: t.kind === 'read' ? 'Read' : t.kind === 'audio' ? 'Listen' : 'Start',\n      chipBg: (KINDS[t.kind] || KINDS.review).bg, chipInk: (KINDS[t.kind] || KINDS.review).ink\n    });\n\n    const hub = [\n      { group: 'Practice & play', tint: '#a8362a', items: [\n        { name: 'GeoChallenge', note: 'Live buzzer game, AI quizzes, scoreboards', href: L.geochallenge, tint: '#e35a4a' },\n        { name: 'Buzzer practice', note: 'USA general, Northeast, Southeast, Red Set 2026', href: L.buzzer, tint: '#f5a524' },\n        { name: 'Quiz tool', note: 'Afghanistan, Brunei, Jordan, Japan, Armenia', href: L.quiz, tint: '#3e9c5f' }\n      ] },\n      { group: 'Country guides', tint: '#4a327d', items: [\n        { name: 'geobee4u — all dossiers', note: 'Afghanistan, Armenia, Brunei, Jordan, Japan are live', href: 'https://geobee4u.blogspot.com', tint: '#6b4ea8' },\n        { name: \"This week's dossiers\", note: tp.region + ' — ' + regionAt(Math.floor(dayDiff(today, new Date(2026, 8, 13)) / 7)).c.join(', '), href: dossier(tp.region), tint: '#6b4ea8' }\n      ] },\n      { group: 'Other study tools', tint: '#0a4344', items: [\n        { name: 'JetPunk map drills', note: 'Place-the-country speed rounds', href: L.jetpunk, tint: '#17888a' },\n        { name: 'NotebookLM', note: 'Audio companions for the dossiers', href: L.notebook, tint: '#17888a' },\n        { name: 'Quizvidya', note: 'Short outside quiz sets', href: L.quizvidya, tint: '#17888a' }\n      ] },\n      { group: 'Plan source', tint: '#8a5a06', items: [\n        { name: 'Weekly study plan (Google Sheet)', note: 'Coach edits here; it flows into this tracker', href: L.sheet, tint: '#f5a524' }\n      ] }\n    ];\n\n    const scores = this.state.scores;\n    const byDate = {};\n    scores.forEach((s, i) => { (byDate[s.date] = byDate[s.date] || []).push(Object.assign({ i }, s)); });\n    const histKeys = Object.keys(Object.assign({}, this.state.days, byDate))\n      .filter((k) => (this.state.days[k] && this.state.days[k].status) || byDate[k])\n      .sort().reverse();\n    const history = histKeys.map((k) => {\n      const v = this.dayVisual(k), p = this.plan(k), d = this.state.days[k] || {};\n      const ss = (byDate[k] || []).map((s) => {\n        const pct = s.total ? Math.round((s.raw / s.total) * 100) : null;\n        return {\n          pct: pct == null ? String(s.raw) : pct + '%',\n          ink: pct == null ? '#16233d' : pct >= 80 ? '#256b40' : pct >= 60 ? '#8a5a06' : '#a8362a',\n          topic: s.topic,\n          meta: (s.total ? s.raw + '/' + s.total + ' · ' : '') + s.source + (s.missed ? ' · missed: ' + s.missed : ''),\n          del: () => { const n = scores.slice(); n.splice(s.i, 1); this.persist({ scores: n }); }\n        };\n      });\n      return {\n        date: pretty(parseKey(k)), pill: v.pill, pillBg: v.pillBg, pillInk: v.pillInk, theme: p.theme,\n        assigned: p.tasks.map((t) => t.title).join(' · '),\n        scores: ss, hasScores: ss.length > 0, note: d.note || ''\n      };\n    });\n\n    const last14 = [];\n    for (let i = 0; i < 14; i++) last14.push(dk(addDays(today, -i)));\n    const logged = last14.filter((k) => (this.state.days[k] || {}).status);\n    const doneish = logged.filter((k) => ['done', 'partial'].indexOf(this.state.days[k].status) > -1);\n    let streak = 0;\n    for (let i = 0; i < 120; i++) {\n      const st = (this.state.days[dk(addDays(today, -i))] || {}).status;\n      if (st === 'done' || st === 'partial') streak++;\n      else if (i > 0) break;\n    }\n    const pcts = scores.filter((s) => s.total).map((s) => (s.raw / s.total) * 100);\n    const avg = pcts.length ? Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length) : null;\n\n    const groups = {};\n    scores.forEach((s) => { if (s.total) (groups[s.topic] = groups[s.topic] || []).push((s.raw / s.total) * 100); });\n    const regionStats = Object.keys(groups).map((n) => {\n      const a = Math.round(groups[n].reduce((x, y) => x + y, 0) / groups[n].length);\n      return { name: n, meta: a + '% · ' + groups[n].length + (groups[n].length === 1 ? ' session' : ' sessions'), width: Math.max(a, 3) + '%', color: a >= 80 ? '#3e9c5f' : a >= 60 ? '#f5a524' : '#e35a4a', avg: a };\n    }).sort((a, b) => a.avg - b.avg);\n    const weak = regionStats.filter((r) => r.avg < 70);\n\n    const sheetKey = this.state.sheetKey;\n    const sp = sheetKey ? this.plan(sheetKey) : null;\n\n    return {\n      tabs,\n      greeting: tStatus === 'done' ? 'Day stamped, ' + name + '.' : beforeRegionals ? 'Ready, ' + name + '?' : 'Hey ' + name + '.',\n      todayDateLine: pretty(today).toUpperCase() + ' · ' + tp.region.toUpperCase(),\n      themeLine: tp.theme + ' — ' + (tp.tasks.length === 1 ? 'one thing today' : tp.tasks.length + ' things today'),\n      todayEffort: tp.tasks.length * 15 + '–' + tp.tasks.length * 25 + ' min',\n      streakLine: streak > 1 ? streak + '-day streak' : streak === 1 ? 'Streak starts today' : 'No streak yet',\n      showStamp: tStatus === 'done',\n      countdownDays: (beforeRegionals ? dRegionals : dNationals) + ' days',\n      countdownLabel: beforeRegionals ? 'to Regionals' : 'to Nationals',\n      statusBtns: this.mkStatusBtns(tKey, true),\n      statusNote: tStatus ? 'Logged — Amma can see it.' : 'One tap when you are done. That is the whole ask.',\n      todayTasks: tp.tasks.map(mkTask),\n      weekDays, weekRows, hub,\n      weekRange: MON[wkStart.getMonth()] + ' ' + wkStart.getDate() + ' – ' + MON[week[6].getMonth()] + ' ' + week[6].getDate(),\n      weekTheme: this.plan(dk(week[3])).theme,\n      prevWeek: () => this.setState({ weekOffset: this.state.weekOffset - 1 }),\n      nextWeek: () => this.setState({ weekOffset: this.state.weekOffset + 1 }),\n      isToday: tab === 'today', isWeek: tab === 'week', isRes: tab === 'res', isLog: tab === 'log',\n      isCoach: tab === 'coach' && this.state.unlocked,\n      isCoachLocked: tab === 'coach' && !this.state.unlocked,\n      coachUnlocked: this.state.unlocked,\n      pinInput: this.state.pinInput, pinError: this.state.pinError,\n      setPin: (e) => this.setState({ pinInput: e.target.value, pinError: '' }),\n      unlock: () => this.state.pinInput === pin\n        ? this.setState({ unlocked: true, pinInput: '', pinError: '', themeDraft: tp.theme })\n        : this.setState({ pinError: 'Not that one.' }),\n      lock: () => this.setState({ unlocked: false, tab: 'today' }),\n      history, historyEmpty: history.length === 0,\n      topicOpts: REGIONS.map((r) => r.name).concat(['Mixed / general', 'Other']),\n      sourceOpts: SOURCES,\n      fTopic: this.state.f.topic, fSource: this.state.f.source, fDate: this.state.f.date,\n      fRaw: this.state.f.raw, fTotal: this.state.f.total, fMissed: this.state.f.missed,\n      setFTopic: (e) => this.setF('topic', e.target.value),\n      setFSource: (e) => this.setF('source', e.target.value),\n      setFDate: (e) => this.setF('date', e.target.value),\n      setFRaw: (e) => this.setF('raw', e.target.value),\n      setFTotal: (e) => this.setF('total', e.target.value),\n      setFMissed: (e) => this.setF('missed', e.target.value),\n      addScore: () => {\n        const f = this.state.f;\n        if (!f.raw) return;\n        const rec = { topic: f.topic, source: f.source, date: f.date, raw: Number(f.raw), total: f.total ? Number(f.total) : null, missed: f.missed.trim() };\n        this.persist({ scores: this.state.scores.concat([rec]), f: Object.assign({}, f, { raw: '', total: '', missed: '' }) });\n      },\n      stats: [\n        { value: streak + (streak === 1 ? ' day' : ' days'), label: 'Current streak', tint: '#e35a4a' },\n        { value: logged.length ? Math.round((doneish.length / Math.max(logged.length, 1)) * 100) + '%' : '—', label: 'Done or halfway, last 14 days', tint: '#3e9c5f' },\n        { value: avg == null ? '—' : avg + '%', label: 'Average score, all sessions', tint: '#17888a' },\n        { value: String(scores.length), label: 'Sessions logged', tint: '#6b4ea8' }\n      ],\n      regionStats, noScores: regionStats.length === 0,\n      hasWeak: weak.length > 0,\n      weakText: weak.map((w) => w.name + ' (' + w.avg + '%)').join(', ') + ' — worth folding back into an upcoming week.',\n      themeDraft: this.state.themeDraft,\n      setThemeDraft: (e) => this.setState({ themeDraft: e.target.value }),\n      saveTheme: () => week.forEach((d) => this.setDay(dk(d), { theme: this.state.themeDraft })),\n      cfgDraft: this.state.cfgDraft,\n      setCfgDraft: (e) => this.setState({ cfgDraft: e.target.value }),\n      saveCfg: () => { this.persist({ cfg: this.state.cfgDraft }); this.connect(this.state.cfgDraft); },\n      cfgStatus: { off: 'Local only — nothing synced yet', connecting: 'Connecting…', live: 'Synced with Firebase', error: 'Could not connect — check the config' }[this.state.sync],\n      syncDot: { off: '#e35a4a', connecting: '#f5a524', live: '#3e9c5f', error: '#e35a4a' }[this.state.sync],\n      syncLabel: { off: 'Saved on this device', connecting: 'Syncing…', live: 'Synced', error: 'Offline' }[this.state.sync],\n      exportData: () => {\n        const blob = new Blob([JSON.stringify({ days: this.state.days, scores: this.state.scores }, null, 2)], { type: 'application/json' });\n        const a = document.createElement('a');\n        a.href = URL.createObjectURL(blob); a.download = 'geo-hub-backup-' + tKey + '.json'; a.click();\n      },\n      sheetOpen: !!sheetKey,\n      sheetTitle: sheetKey ? pretty(parseKey(sheetKey)) : '',\n      sheetSub: sp ? sp.theme : '',\n      sheetTasks: sp ? sp.tasks.map(mkTask) : [],\n      sheetStatusBtns: sheetKey ? this.mkStatusBtns(sheetKey, false) : [],\n      closeSheet: () => this.setState({ sheetKey: null }),\n      stop: (e) => e.stopPropagation(),\n      noteDraft: this.state.noteDraft,\n      setNoteDraft: (e) => this.setState({ noteDraft: e.target.value }),\n      saveNote: () => { this.setDay(sheetKey, { note: this.state.noteDraft }); this.setState({ sheetKey: null }); },\n      tasksDraft: this.state.tasksDraft,\n      setTasksDraft: (e) => this.setState({ tasksDraft: e.target.value }),\n      saveTasks: () => {\n        const tasks = this.state.tasksDraft.split('\\n').map((l) => l.trim()).filter(Boolean).map((l) => {\n          const m = l.match(/^(read|quiz|buzzer|audio|map|review)\\s*:\\s*(.+)$/i);\n          const kind = m ? m[1].toLowerCase() : 'review';\n          const title = m ? m[2] : l;\n          const href = { quiz: L.quiz, buzzer: L.buzzer, audio: L.notebook, map: L.jetpunk, read: 'https://geobee4u.blogspot.com' }[kind] || null;\n          return { kind, title, detail: '', href };\n        });\n        this.setDay(sheetKey, { tasks: tasks.length ? tasks : null });\n        this.setState({ sheetKey: null });\n      },\n      resetTasks: () => { this.setDay(sheetKey, { tasks: null }); this.setState({ sheetKey: null, tasksDraft: '' }); },\n      pushToTomorrow: () => {\n        const tomorrow = dk(addDays(parseKey(sheetKey), 1));\n        const carried = sp.tasks.map((t) => ({ kind: t.kind, title: t.title, detail: t.detail, href: t.href }));\n        const existing = this.plan(tomorrow).tasks.map((t) => ({ kind: t.kind, title: t.title, detail: t.detail, href: t.href }));\n        this.setDay(sheetKey, { status: 'carried' });\n        this.setDay(tomorrow, { tasks: existing.concat(carried) });\n        this.setState({ sheetKey: null });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
